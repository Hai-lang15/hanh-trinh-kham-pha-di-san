<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Hành trình khám phá Di sản</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            🏛️<span>Di Sản</span>
        </div>
        <nav>
            <a href="index.html" class="menu">
                🏠<span>Tổng quan</span>
            </a>
            <a href="disan.html" class="menu active">
                🏛️<span>Di sản</span>
            </a>
            <a href="baiviet.html" class="menu">
                📝<span>Bài viết</span>
            </a>
            <a href="nguoidung.html" class="menu">
                👥<span>Người dùng</span>
            </a>
             <a href="media.html" class="menu">
                🖼️<span>Hình ảnh & Video</span>
            </a>
            <!-- <a href="#" class="menu">
                📂<span>Danh mục</span>
            </a>

            <a href="#" class="menu">
                ⚙️<span>Cài đặt</span>
            </a> -->
        </nav>
        <div class="logout"> 
            <button id="btnDangXuat">🚪 Đăng xuất</button>
        </div>
    </aside>
        <main class="main">
        <div class="table-container">
                <div class="table-header">
                    <div>
                        <h2>Danh sách di sản</h2>
                        <p>Các di sản đang được quản lý</p>
                    </div>
                    <button class="btn-add" id="btnThem">
                        + Thêm di sản
                    </button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên di sản</th>
                                <th>Địa chỉ</th>
                                <th>Xếp hạng</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="danhSachDiSan">
                            <tr>
                                <td colspan="6" class="loading">
                                    Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Thêm di sản</h2>
                <button id="btnDong">
                    ×
                </button>
            </div>

            <form id="formDiSan">
                <div class="form-row">
                    <div class="form-group">
                        <label>Tên di sản</label>
                        <input type="text" id="ten_di_san" required>
                    </div>

                    <div class="form-group">
                        <label>Địa chỉ</label>
                        <input type="text" id="dia_chi" required>
                    </div>
                </div>

                 <div class="form-row">
                    <div class="form-group">
                        <label>Vĩ độ</label>
                        <input type="number" step="any" id="vi_do" placeholder="Ví dụ: 10.8612345">
                    </div>

                    <div class="form-group">
                        <label>Kinh độ</label>
                        <input type="number" step="any" id="kinh_do" placeholder="Ví dụ: 106.6254321">
                    </div>
                </div>
                

                <div class="form-group">
                    <label>Lịch sử hình thành</label>
                    <textarea id="lich_su_hinh_thanh"></textarea>
                </div>

                <div class="form-group">
                    <label>Nhân vật liên quan</label>
                    <textarea id="nhan_vat_lien_quan"></textarea>
                </div>

                <div class="form-group">
                    <label>Sự kiện lịch sử</label>
                    <textarea id="su_kien_lich_su"></textarea>
                </div>

                <div class="form-group">
                    <label>Giá trị văn hóa</label>
                    <textarea id="gia_tri_van_hoa"></textarea>
                </div>


                <div class="form-group">
                    <label>Kiến trúc</label>
                    <textarea id="kien_truc"></textarea>
                </div>


                <div class="form-row">
                    <div class="form-group">
                        <label>Xếp hạng</label>
                        <input type="text" id="xep_hang">
                    </div>


                    <div class="form-group">
                        <label>Đơn vị quản lý</label>
                        <input type="text" id="don_vi_quan_ly">
                    </div>
                </div>


                <div class="form-group">
                    <label for="hinh_anh">Hình ảnh</label>
                    <input type="file" id="hinh_anh" name="hinh_anh" accept="image/*" multiple>
                </div>

                <div class="form-group">
                    <label for="video_di_san">Video di sản</label>

                    <input type="file"id="video_di_san"name="video"accept="video/mp4,video/webm,video/quicktime"multiple>

                    <small class="form-note">
                        Có thể chọn nhiều video. Tối đa 100MB/video.
                    </small>
                </div>

                <div class="form-group">
                    <label for="video_tieu_de">Tiêu đề video</label>

                    <input type="text"id="video_tieu_de"placeholder="Ví dụ: Toàn cảnh Chùa Tường Quang">
                </div>

                <div class="form-group">
                    <label for="video_mo_ta">Mô tả video</label>

                    <textarea id="video_mo_ta"rows="3"placeholder="Mô tả ngắn về video..."></textarea>
                </div>


                <div class="modal-footer">
                    <button type="button"class="btn-cancel"id="btnHuy">
                        Hủy
                    </button>

                    <button type="submit" class="btn-save">
                        Lưu di sản
                    </button>
                </div>
            </form>
        </div>
    </div>
    </main>
    <script src="js/disan.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
