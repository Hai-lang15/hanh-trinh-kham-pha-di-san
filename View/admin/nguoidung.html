<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Người dùng</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/nguoidung.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            🏛️<span>Di Sản</span>
        </div>

        <nav>
            <a href="index.html" class="menu">
                🏠<span>Tổng quan</span>
            </a>

            <a href="disan.html" class="menu">
                🏛️<span>Di sản</span>
            </a>

            <a href="baiviet.html" class="menu">
                📝<span>Bài viết</span>
            </a>

            <a href="nguoidung.html" class="menu active">
                👥<span>Người dùng</span>
            </a>
             <a href="media.html" class="menu">
                🖼️<span>Hình ảnh & Video</span>
            </a>

            <!-- <a href="#" class="menu">
                
                📂<span>Danh mục</span>
            </a>

            <a href="#" class="menu">
                ⚙️<span>Cài đặt</span>
            </a> -->
        </nav>

        <div class="logout"> 
            <button id="btnDangXuat">🚪 Đăng xuất</button>
        </div>
    </aside>

    <main class="main">
        <div class="table-container">
            <div class="table-header">
                <div>
                    <h2>Danh sách người dùng</h2>
                    <p>Quản lý tài khoản người dùng</p>
                </div>

                <button class="btn-add" id="btnThem">
                    + Thêm người dùng
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Ngày tạo</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="danhSachNguoiDung">
                        <tr>
                            <td colspan="7" class="loading">
                                Đang tải dữ liệu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tieuDeModal">Thêm người dùng</h2>

                <button id="btnDong">
                    ×
                </button>
            </div>

            <form id="formNguoiDung">
                <div class="form-group">
                    <label>Họ tên</label>
                    <input type="text" id="ho_ten" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="mat_khau">
                </div>

                <div class="form-group">
                    <label>Ảnh đại diện</label>
                    <input type="text" id="anh_dai_dien" placeholder="URL hình ảnh">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Vai trò</label>
                        <select id="vai_tro">
                            <option value="nguoi_dung">Người dùng</option>
                            <option value="quan_tri_vien">Quản trị viên</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Trạng thái</label>
                        <select id="trang_thai">
                            <option value="hoat_dong">Hoạt động</option>
                            <option value="bi_khoa">Bị khóa</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="btnHuy">
                        Hủy
                    </button>

                    <button type="submit" class="btn-save">
                        Lưu người dùng
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/nguoidung.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
